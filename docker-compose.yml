services:
  mizan-core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    container_name: mizan-core
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - mizan-data:/app/packages/database/prisma
      - mizan-uploads:/app/apps/core/public/uploads
      - mizan-root-uploads:/app/public/uploads
    restart: unless-stopped

  mizan-data:
    build:
      context: .
      dockerfile: apps/data/Dockerfile
    container_name: mizan-data
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    volumes:
      - mizan-data:/app/packages/database/prisma
      - mizan-uploads:/app/apps/data/public/uploads
    restart: unless-stopped

  mizan-pipelines:
    build:
      context: .
      dockerfile: apps/pipelines/Dockerfile
    container_name: mizan-pipelines
    ports:
      - "3002:3002"
    env_file:
      - .env.production
    volumes:
      - mizan-data:/app/packages/database/prisma
    restart: unless-stopped

  mizan-admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: mizan-admin
    ports:
      - "3003:3003"
    env_file:
      - .env.production
    volumes:
      - mizan-data:/app/packages/database/prisma
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mizan-gateway
    ports:
      - "80:80"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mizan-core
      - mizan-data
      - mizan-pipelines
      - mizan-admin
    restart: unless-stopped

volumes:
  mizan-data:
  mizan-uploads:
  mizan-root-uploads:
