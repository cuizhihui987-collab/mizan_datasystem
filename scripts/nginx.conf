upstream core       { server mizan-core:3000; }
upstream data       { server mizan-data:3001; }
upstream pipelines  { server mizan-pipelines:3002; }
upstream admin      { server mizan-admin:3003; }

server {
  listen 80;
  client_max_body_size 50M;

  location / {
    proxy_pass http://core;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /files/ {
    proxy_pass http://data;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ~ ^/schemas/([^/]+)/pipelines/ {
    proxy_pass http://pipelines;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /settings/ {
    proxy_pass http://admin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
